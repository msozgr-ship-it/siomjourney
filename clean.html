<!DOCTYPE html>
<html>
<head>
    <title>Extract JS Functions</title>
</head>
<body>
    <pre id="output">Loading...</pre>
    <script>
        fetch('js/app.js')
            .then(res => res.text())
            .then(text => {
                const cleaned = text.trim();
                
                // Let's find functions
                function getFunctionBody(funcName) {
                    const index = cleaned.indexOf(funcName);
                    if (index === -1) return `${funcName} not found`;
                    
                    // find opening brace
                    let braceCount = 0;
                    let started = false;
                    let body = "";
                    for (let i = index; i < cleaned.length; i++) {
                        const char = cleaned[i];
                        body += char;
                        if (char === '{') {
                            braceCount++;
                            started = true;
                        } else if (char === '}') {
                            braceCount--;
                        }
                        if (started && braceCount === 0) {
                            break;
                        }
                    }
                    return body;
                }

                const renderContentBody = getFunctionBody('function renderContent');
                const renderOrbitalBody = getFunctionBody('function renderOrbital');
                
                document.getElementById('output').textContent = 
                    `=== renderContent ===\n${renderContentBody}\n\n` +
                    `=== renderOrbital ===\n${renderOrbitalBody}`;
            })
            .catch(err => {
                document.getElementById('output').textContent = 'Error: ' + err.message;
            });
    </script>
</body>
</html>
