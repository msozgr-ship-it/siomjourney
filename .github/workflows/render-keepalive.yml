name: Render Streamer Keep-Alive

on:
  schedule:
    # Render sleeps after 15 min of inactivity.
    # We ping every 10 minutes to keep it 100% warm 24/7.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Streamer Bridge
        run: |
          echo "Sending keep-alive ping to Render streamer..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 50 "https://siom-tg-streamer-1.onrender.com/")
          echo "Render HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "Render streamer is awake and healthy!"
          else
            echo "Warning: Received status $HTTP_STATUS"
          fi
