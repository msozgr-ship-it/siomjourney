<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiomJourney | Sinematik Oynatıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050508;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* ── Ambient Backdrop ── */
        .player-backdrop {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: blur(80px) brightness(0.18) saturate(1.6);
            opacity: 0.75; z-index: 1;
            transition: opacity 1.2s ease;
        }
        .player-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 15%, rgba(5,5,8,0.97) 100%);
            z-index: 2;
        }

        /* ── Header (auto-hide) ── */
        .player-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 28px 44px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(5,5,8,0.96) 0%, transparent 100%);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .player-header.hidden {
            opacity: 0; transform: translateY(-22px); pointer-events: none;
        }

        /* ── Title area ── */
        .player-title-area { display: flex; flex-direction: column; gap: 10px; }
        .player-badge {
            display: inline-flex; align-items: center; gap: 7px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            padding: 4px 14px; border-radius: 20px;
            font-size: 9px; font-weight: 800; letter-spacing: 1.8px;
            text-transform: uppercase; width: fit-content;
            box-shadow: 0 0 22px rgba(255,0,85,0.35);
        }
        .badge-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: #fff; opacity: 0.8;
            animation: badgePulse 1.8s infinite ease-in-out;
        }
        @keyframes badgePulse {
            0%,100% { transform: scale(1); opacity: 0.5; }
            50%      { transform: scale(1.4); opacity: 1; }
        }
        .player-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.3px;
            background: linear-gradient(to right, #fff 60%, #9999bb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── Film / Fragman toggle buttons ── */
        .toggle-row {
            display: flex; gap: 10px; margin-top: 2px;
        }
        .toggle-btn {
            padding: 7px 20px; border-radius: 24px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
            border: 1.5px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.55);
        }
        .toggle-btn.active {
            background: rgba(255,255,255,0.92);
            border-color: #fff;
            color: #050508;
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }
        .toggle-btn:not(.active):hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .toggle-btn.trailer-btn.active {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px rgba(255,0,85,0.4);
        }
        
        /* ── Language toggle buttons ── */
        .lang-btn {
            padding: 5px 14px; border-radius: 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.7);
        }
        .lang-btn.active {
            background: rgba(255,255,255,0.85);
            border-color: #fff;
            color: #000;
        }
        .lang-btn:not(.active):hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        /* ── Close button ── */
        .player-close-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 11px 26px;
            border-radius: 30px; font-family: 'Outfit', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
            display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .player-close-btn:hover {
            background: rgba(255,0,85,0.15);
            border-color: rgba(255,0,85,0.35);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255,0,85,0.2);
        }

        /* ── Video canvas ── */
        .player-canvas {
            position: relative; width: 100vw; height: 100vh;
            z-index: 10; background: #050508;
            display: flex; align-items: center; justify-content: center;
            padding: 80px 44px; /* Generous margins around the screen frame */
        }
        .player-screen-wrapper {
            width: 100%;
            max-width: 1280px;
            max-height: 68vh;
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 24px;
            background: #000;
            border: 6px solid #13131c;
            outline: 1.5px solid rgba(255, 215, 0, 0.18);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85);
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-container {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .player-glaze {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, transparent 50%, rgba(0, 0, 0, 0.12) 100%);
            pointer-events: none; z-index: 15;
        }
        .frame-led {
            position: absolute; bottom: 1px; left: 50%;
            transform: translateX(-50%); width: 5px; height: 5px;
            border-radius: 50%; background: #ffd700;
            box-shadow: 0 0 8px #ffd700; z-index: 100;
            animation: ledBreathe 3s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes ledBreathe {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.85); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); box-shadow: 0 0 12px #ffd700, 0 0 4px #ffd700; }
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: #000;
            display: block;
            z-index: 11;
        }
        video {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: #000;
            display: block;
            position: relative;
            z-index: 12;
        }

        /* ── Archive.org logo blocker ── */
        .logo-blocker {
            position: absolute; top: 40px; left: 40px;
            width: 56px; height: 56px; background: #000;
            z-index: 99999; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.98);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .blocker-dot {
            width: 7px; height: 7px; background: #ff0055;
            border-radius: 50%; box-shadow: 0 0 10px #ff0055;
            animation: bdPulse 2s infinite;
        }
        @keyframes bdPulse {
            0%,100% { transform: scale(1); opacity: 0.5; }
            50%      { transform: scale(1.35); opacity: 1; }
        }

        /* ── Loading screen ── */
        .player-loader {
            position: absolute; inset: 0; background: #050508;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; gap: 20px; transition: opacity 0.22s ease;
        }
        .loader-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,0,85,0.12);
            border-top: 3px solid #ff0055;
            border-radius: 50%; animation: spin 1s linear infinite;
            box-shadow: 0 0 24px rgba(255,0,85,0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-size: 13px; font-weight: 600;
            letter-spacing: 2.5px; color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .player-header { padding: 18px 20px; }
            .player-title { font-size: 16px; }
            .player-close-btn { padding: 8px 16px; font-size: 11px; }
            .toggle-btn { padding: 5px 14px; font-size: 10px; }
            .player-canvas {
                padding: 60px 12px 20px 12px;
            }
            .player-screen-wrapper {
                border-width: 3px;
                border-radius: 12px;
                outline-width: 1px;
                max-height: 55vh;
            }
            .frame-led {
                width: 3px; height: 3px; bottom: 0px;
            }
        }

        /* ── Sinematik Ambilight Frame ── */
        .player-screen-wrapper.ambilight {
            box-shadow: 0 0 100px rgba(255, 0, 85, 0.25), 0 0 40px rgba(255, 85, 0, 0.15), 0 30px 90px rgba(0, 0, 0, 0.85);
            outline-color: rgba(255, 0, 85, 0.35);
            border-color: #171724;
        }

        /* ── Premium Details Dock (frosted glass) ── */
        .details-dock {
            position: absolute;
            bottom: 40px;
            left: 44px;
            max-width: 480px;
            background: rgba(5, 5, 8, 0.58);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 255, 255, 0.01) inset;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: auto;
        }
        .details-dock.hidden {
            opacity: 0;
            transform: translateY(22px);
            pointer-events: none;
        }
        .dock-meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .dock-match {
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0,255,102,0.3);
        }
        .dock-year {
            color: rgba(255,255,255,0.7);
        }
        .dock-quality {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            letter-spacing: 0.5px;
            font-weight: 800;
            color: #ffaa00;
        }
        .dock-rating-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ffdd00;
        }
        .dock-desc {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            font-weight: 400;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .dock-highlights {
            font-size: 11.5px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.08) 0%, rgba(255, 85, 0, 0.04) 100%);
            border-left: 3px solid #ff0055;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* ── Ticket Intro Overlay ── */
        .ticket-overlay {
            position: fixed; inset: 0;
            background: #050508;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), visibility 1s;
        }
        .ticket-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .ticket-card {
            display: flex;
            width: 620px; height: 310px;
            background: rgba(18, 18, 26, 0.72);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.9), 0 0 50px rgba(255,215,0,0.06);
            transform: scale(0.92);
            opacity: 0;
            animation: ticketEntrance 1s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.1s;
            position: relative;
        }
        @keyframes ticketEntrance {
            to { transform: scale(1); opacity: 1; }
        }
        .ticket-card::before, .ticket-card::after {
            content: '';
            position: absolute;
            width: 32px; height: 32px;
            background: #050508;
            border-radius: 50%;
            left: 184px;
            z-index: 10;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .ticket-card::before { top: -16px; box-shadow: 0 5px 10px rgba(0,0,0,0.5) inset; }
        .ticket-card::after { bottom: -16px; box-shadow: 0 -5px 10px rgba(0,0,0,0.5) inset; }
        
        .ticket-left {
            width: 200px; height: 100%;
            border-right: 1px dashed rgba(255, 215, 0, 0.25);
            position: relative;
        }
        .ticket-poster {
            width: 100%; height: 100%;
            background-size: cover; background-position: center;
        }
        .ticket-right {
            flex: 1;
            padding: 32px 36px;
            display: flex; flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .ticket-badge {
            font-size: 10px; font-weight: 800; letter-spacing: 2px;
            color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3);
            text-transform: uppercase;
        }
        .ticket-title-display {
            font-size: 28px; font-weight: 900;
            line-height: 1.2;
            margin-top: 10px;
            background: linear-gradient(135deg, #fff 40%, #ffd700 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .ticket-meta-row {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
        .ticket-dot {
            width: 4px; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 50%;
        }
        .ticket-quality-badge {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 1px 6px; border-radius: 4px;
            color: #ffd700; font-size: 10px; font-weight: 800;
        }
        .ticket-footer {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-top: auto;
        }
        .ticket-barcode {
            font-family: monospace; font-size: 13px;
            color: rgba(255,255,255,0.25); letter-spacing: 1px;
        }
        .ticket-logo {
            font-size: 11px; font-weight: 900; letter-spacing: 1.5px;
            color: rgba(255,255,255,0.35);
        }

        @media (max-width: 768px) {
            .details-dock {
                left: 20px; bottom: 20px; max-width: calc(100% - 40px);
                padding: 16px;
            }
            .ticket-card {
                width: 90%; height: auto; flex-direction: column;
            }
            .ticket-left {
                width: 100%; height: 160px; border-right: none;
                border-bottom: 1px dashed rgba(255, 215, 0, 0.25);
            }
            .ticket-card::before, .ticket-card::after { display: none; }
        }
    </style>
</head>
<body>

<!-- ── Premium Ticket Intro Overlay ── -->
<div class="ticket-overlay" id="ticket-overlay">
    <div class="ticket-card">
        <div class="ticket-left">
            <div class="ticket-poster" id="ticket-poster"></div>
        </div>
        <div class="ticket-right">
            <div>
                <div class="ticket-badge">VIP GİRİŞ BİLETİ</div>
                <div class="ticket-title-display" id="ticket-title-display">Yükleniyor...</div>
                <div class="ticket-meta-row">
                    <span id="ticket-year">2024</span>
                    <span class="ticket-dot"></span>
                    <span class="ticket-quality-badge" id="ticket-quality">4K HDR</span>
                </div>
            </div>
            <div class="ticket-footer">
                <div class="ticket-barcode">||||| | |||| ||| | |||</div>
                <div class="ticket-logo">SIOMCINEMA</div>
            </div>
        </div>
    </div>
</div>

<div class="player-backdrop" id="player-bg"></div>
<div class="player-overlay"></div>

<div class="player-loader" id="player-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Premium Sinema Yükleniyor...</div>
</div>

<div id="mouse-catcher" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:90; pointer-events:none;"></div>
<header class="player-header" id="player-header">
    <div class="player-title-area">
        <span class="player-badge" id="player-badge">
            <span class="badge-dot"></span>
            <span id="badge-label">SİNEMA MODU</span>
        </span>
        <h1 id="player-title" class="player-title">Yükleniyor...</h1>
        <div class="toggle-row" id="toggle-row" style="display:none;">
            <button class="toggle-btn active" id="btn-movie" onclick="switchToMovie()">▶ Filmi İzle</button>
            <button class="toggle-btn trailer-btn" id="btn-trailer" onclick="switchToTrailer()">🎬 Fragmanı İzle</button>
        </div>
        <div class="toggle-row" id="lang-row" style="display:none; margin-left:15px; padding-left:15px; border-left:1px solid rgba(255,255,255,0.1);">
            <button class="lang-btn active" id="btn-lang-dub" onclick="switchLanguage('dub')">🇹🇷 DUB</button>
            <button class="lang-btn" id="btn-lang-sub" onclick="switchLanguage('sub')">💬 ALTYAZI</button>
        </div>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button class="player-close-btn" onclick="window.close()">✕ Kapat</button>
    </div>
</header>

<div class="player-canvas">
    <div class="player-screen-wrapper" id="player-screen-wrapper">
        <div class="player-container" id="video-container"></div>
        <div class="player-glaze"></div>
        <div class="frame-led"></div>
    </div>
</div>

<!-- ── Frosted Glass Details Dock ── -->
<div class="details-dock" id="details-dock" style="display: none;">
    <div class="dock-meta-row">
        <span class="dock-match" id="dock-match">98% Eşleşme</span>
        <span class="dock-year" id="dock-year">2024</span>
        <span class="dock-quality" id="dock-quality">Full HD</span>
        <span class="dock-rating-badge">⭐ <span id="dock-rating">8.5</span></span>
    </div>
    <p class="dock-desc" id="dock-desc">Yükleniyor...</p>
    <div class="dock-highlights" id="dock-highlights">✨ highlights</div>
</div>

<script>
    /* ─── URL parametrelerini parse et ─── */
    const params     = new URLSearchParams(window.location.search);
    const fileUrl    = params.get('file')    || '';
    const fileSubUrl = params.get('filesub') || '';
    const trailerUrl = params.get('trailer') || '';
    const movieTitle = params.get('title')   || 'Sinematik Deneyim';
    const moviePoster= params.get('poster')  || '';
    const desc       = params.get('desc')       || '';
    const year       = params.get('year')       || '';
    const rating     = params.get('rating')     || '';
    const match      = params.get('match')      || '';
    const meta       = params.get('meta')       || '';
    const highlights = params.get('highlights') || '';

    let currentMode = 'movie'; // 'movie' | 'trailer'
    let currentLang = 'dub';   // 'dub' | 'sub'

    /* ─── UI kurulumu ─── */
    document.getElementById('player-title').textContent = movieTitle;

    // Golden Ticket bindings
    document.getElementById('ticket-title-display').textContent = movieTitle;
    document.getElementById('ticket-year').textContent = year || '2025';
    document.getElementById('ticket-quality').textContent = meta || 'Full HD';

    if (moviePoster && moviePoster !== 'null') {
        document.getElementById('player-bg').style.backgroundImage = `url(${moviePoster})`;
        document.getElementById('ticket-poster').style.backgroundImage = `url(${moviePoster})`;
    }

    // Details Dock bindings
    if (desc) {
        document.getElementById('dock-desc').textContent = desc;
        document.getElementById('dock-match').textContent = match ? `${match} Eşleşme` : '98% Eşleşme';
        document.getElementById('dock-year').textContent = year || '2025';
        document.getElementById('dock-quality').textContent = meta || 'Full HD';
        document.getElementById('dock-rating').textContent = rating || '8.2';
        
        if (highlights) {
            document.getElementById('dock-highlights').innerHTML = `✨ <strong>Öne Çıkan:</strong> ${highlights}`;
            document.getElementById('dock-highlights').style.display = 'block';
        } else {
            document.getElementById('dock-highlights').style.display = 'none';
        }
        document.getElementById('details-dock').style.display = 'flex';
    } else {
        document.getElementById('details-dock').style.display = 'none';
    }

    // Ticket fadeout animation timer (2.5 seconds)
    setTimeout(() => {
        const ticket = document.getElementById('ticket-overlay');
        if (ticket) {
            ticket.classList.add('fade-out');
            setTimeout(() => {
                ticket.style.display = 'none';
                // Add ambilight class to screen wrapper once ticket is gone
                const screenWrapper = document.getElementById('player-screen-wrapper');
                if (screenWrapper) screenWrapper.classList.add('ambilight');
            }, 1000);
        }
    }, 2500);

    // Fragman varsa toggle satırını göster
    if (fileUrl && trailerUrl) {
        document.getElementById('toggle-row').style.display = 'flex';
    }
    
    // Altyazı seçeneği varsa dil satırını göster
    if (fileUrl && fileSubUrl) {
        document.getElementById('lang-row').style.display = 'flex';
    }

    /* ─── Auto-hide header ─── */
    let idleTimer;
    const header = document.getElementById('player-header');
    const mouseCatcher = document.getElementById('mouse-catcher');
    
    function resetIdle() {
        header.classList.remove('hidden');
        const dock = document.getElementById('details-dock');
        if (dock && dock.style.display !== 'none') {
            dock.classList.remove('hidden');
        }
        document.body.style.cursor = 'default';
        if (mouseCatcher) mouseCatcher.style.pointerEvents = 'none';
        
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            header.classList.add('hidden');
            if (dock) {
                dock.classList.add('hidden');
            }
            document.body.style.cursor = 'none';
            if (mouseCatcher) mouseCatcher.style.pointerEvents = 'auto';
        }, 3500);
    }
    document.addEventListener('mousemove', resetIdle);
    document.addEventListener('touchstart', resetIdle);
    if (mouseCatcher) mouseCatcher.addEventListener('mousemove', resetIdle);
    resetIdle();

    /* ─── İlk yükleme ─── */
    const container = document.getElementById('video-container');

    if (!fileUrl) {
        container.innerHTML = '<div style="color:rgba(255,255,255,0.35);font-size:17px;font-weight:500;padding:20px;">Geçersiz video adresi.</div>';
        fadeOutLoader();

        loadMovie();
    }

    /* ─── Toggle aksiyonları ─── */

    function switchLanguage(lang) {

        currentLang = lang;
        
        if (lang === 'dub') {

    /* ─── HD kalite yardımcıları ─── */
    const DM_HD = 'autoplay=1&quality=best&queue-enable=false&queue-autoplay-next=false';
    const YT_HD = 'autoplay=1&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&vq=highres&hd=1';

    function extractArchiveId(url) {
        if (url.includes('archive.org/embed/')) return url.split('archive.org/embed/')[1]?.split('?')[0]?.split('/')[0];
        if (url.includes('archive.org/details/')) return url.split('archive.org/details/')[1]?.split('?')[0]?.split('/')[0];
        if (url.includes('archive.org/download/')) return url.split('archive.org/download/')[1]?.split('/')[0];
        return '';
    }

    function pickBestArchiveFile(files) {
        return (files || [])
            .filter(f => {
                const n = (f.name || '').toLowerCase();
                return /\.(mp4|mkv|webm|ogv|m4v)$/i.test(n)
                    && !n.includes('sample')
                    && !n.includes('thumb')
                    && !n.includes('gif')
                    && (f.size || 0) > 500000;
            })
            .sort((a, b) => (b.size || 0) - (a.size || 0))[0];
    }

    async function getArchiveHdStreamUrl(url) {
        const id = extractArchiveId(url);
        if (!id) return null;
        const cacheKey = `sj_archive_hd_${id}`;
        try {
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) return cached;
        } catch (e) { /* ignore */ }
        try {
            const res = await fetch(`https://archive.org/metadata/${id}`);
            const data = await res.json();
            const best = pickBestArchiveFile(data.files);
            if (best) {
                const streamUrl = `https://archive.org/download/${id}/${encodeURIComponent(best.name)}`;
                try { sessionStorage.setItem(cacheKey, streamUrl); } catch (e) { /* ignore */ }
                return streamUrl;
            }
        } catch (e) {
            console.warn('Archive HD metadata:', e);
        }
        return null;
    }

    function getArchiveEmbedUrl(url) {
        const id = extractArchiveId(url);
        if (!id) return url;
        let embedUrl = url.includes('/embed/') ? url : `https://archive.org/embed/${id}`;
        if (!embedUrl.includes('autoplay')) {
            embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';
        }
        // Archive.org için en yüksek kalite parametresi
        embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'format=mp4&quality=high';
        return embedUrl;
    }

    function ensureVkHd(url) {
        if (!url.includes('vkvideo.ru') && !url.includes('vk.com')) return url;
        
        let newUrl = url;
        // Eğer bazı ISS'lerde vk.com yavaş kalıyorsa, orijinal vkvideo.ru CDN sunucusunu muhafaza et
        // Ancak hd=3 (1080p) ve autoplay=1 parametrelerini garanti altına al
        if (/[?&]hd=[124]/.test(newUrl)) {
            newUrl = newUrl.replace(/hd=[124]/, 'hd=3');
        } else if (!/[?&]hd=3/.test(newUrl)) {
            newUrl += (newUrl.includes('?') ? '&' : '?') + 'hd=3';
        }
        
        if (!/[?&]autoplay=/.test(newUrl)) {
            newUrl += '&autoplay=1';
        }
        return newUrl;
    }

    function setNativeVideo(src, onError) {
        container.innerHTML = `<video id="player-video" src="${src}" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
        const v = document.getElementById('player-video');
        v.addEventListener('canplay', fadeOutLoader);
        if (onError) v.addEventListener('error', onError, { once: true });
        
        // Tarayıcı otomatik oynatma (autoplay) engeline takılırsa yükleniyorda kalmaması için 1.5 sn yedek zaman aşımı
        setTimeout(fadeOutLoader, 1500);
    }

    /* ─── Film yükleyici (HD öncelikli, hızlı açılış) ─── */
    async function loadMovie() {
        let currentFileUrl = (currentLang === 'sub' && fileSubUrl) ? fileSubUrl : fileUrl;
        if (!currentFileUrl) return;

        showLoader();

        // Archive.org → Metadata API'den en yüksek kaliteli stream linkini çek, doğrudan <video> tagında oynat!
        if (currentFileUrl.includes('archive.org')) {
            try {
                const hdStreamUrl = await getArchiveHdStreamUrl(currentFileUrl);
                if (hdStreamUrl) {
                    setNativeVideo(hdStreamUrl, () => {
                        // Hata durumunda embed player'a güvenli geri dönüş (fallback)
                        console.warn('Direct stream failed, falling back to embed player.');
                        setIframe(getArchiveEmbedUrl(currentFileUrl), true);
                    });
                    return;
                }
            } catch(e) {
                console.warn('Archive HD stream failed, falling back to embed:', e);
            }
            setIframe(getArchiveEmbedUrl(currentFileUrl), true);
            return;
        }

        // Gerçek .mp4 / stream
        if (currentFileUrl.endsWith('.mp4') || currentFileUrl.includes('.mp4?') || currentFileUrl.includes('.mkv') || currentFileUrl.includes('.webm')) {
            setNativeVideo(currentFileUrl, () => setIframe(currentFileUrl, false));
            return;
        }
        // Dailymotion → Standard working HTML5 Embed (Fullscreen fixed programmatically via setIframe)
        if (currentFileUrl.includes('dailymotion.com') || currentFileUrl.includes('dai.ly') || currentFileUrl.includes('geo.dailymotion.com')) {
            let dmId = '';
            if (currentFileUrl.includes('video/')) {
                dmId = currentFileUrl.split('video/')[1]?.split('?')[0]?.split('&')[0];
            } else if (currentFileUrl.includes('video=')) {
                dmId = currentFileUrl.split('video=')[1]?.split('&')[0];
            } else if (currentFileUrl.includes('dai.ly/')) {
                dmId = currentFileUrl.split('dai.ly/')[1]?.split('?')[0];
            } else if (currentFileUrl.includes('embed/video/')) {
                dmId = currentFileUrl.split('embed/video/')[1]?.split('?')[0];
            } else if (currentFileUrl.includes('embed/')) {
                dmId = currentFileUrl.split('embed/')[1]?.split('?')[0];
            }
            
            if (dmId) {
                // Evrensel Dailymotion embed yapısına geri dönüldü. Tam ekran butonu programmatic setIframe ile başarıyla korundu.
                setIframe(`https://www.dailymotion.com/embed/video/${dmId}?${DM_HD}`, false);
                return;
            }
            setIframe(currentFileUrl, false);
            return;
        }
        // YouTube
        if (currentFileUrl.includes('youtube.com') || currentFileUrl.includes('youtu.be')) {
            let ytId = '';
            if (currentFileUrl.includes('embed/')) ytId = currentFileUrl.split('embed/')[1]?.split('?')[0];
            else ytId = currentFileUrl.split('v=')[1]?.split('&')[0] || currentFileUrl.split('youtu.be/')[1]?.split('?')[0];
            setIframe(`https://www.youtube-nocookie.com/embed/${ytId}?${YT_HD}`, false);
            return;
        }
        // VK → hd=3 (1080p)
        if (currentFileUrl.includes('ok.ru') || currentFileUrl.includes('vkvideo.ru') || currentFileUrl.includes('vk.com')) {
            setIframe(ensureVkHd(currentFileUrl), false);
            return;
        }
        // Rumble ve diğer iframe platformları
        if (currentFileUrl.includes('rumble.com')) {
            setIframe(currentFileUrl, false);
            return;
        }
        setIframe(currentFileUrl, false);
    }

    /* ─── Fragman yükleyici ─── */
    function loadTrailer() {
        if (!trailerUrl) return;

        let finalUrl = trailerUrl;

        // youtu.be → embed URL'ye çevir
        if (trailerUrl.includes('youtu.be')) {
            const id    = trailerUrl.split('youtu.be/')[1]?.split('?')[0];
            const siParam = trailerUrl.includes('si=') ? '' : '';
            finalUrl = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&playsinline=1&vq=highres&hd=1`;
        } else if (trailerUrl.includes('youtube.com/watch')) {
            const id = trailerUrl.split('v=')[1]?.split('&')[0];
            finalUrl = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&playsinline=1&vq=highres&hd=1`;
        } else if (trailerUrl.includes('youtube.com/embed/')) {
            finalUrl = trailerUrl + (trailerUrl.includes('?') ? '&' : '?') + 'autoplay=1&modestbranding=1&rel=0&iv_load_policy=3&vq=highres&hd=1';
        }

        setIframe(finalUrl, false);
    }

    /* ─── Programmatik Iframe Kurucu (Güvenlik & Fullscreen İzinleri) ─── */
    function setIframe(url, showBlocker) {
        container.innerHTML = '';
        if (showBlocker) {
            const blocker = document.createElement('div');
            blocker.className = 'logo-blocker';
            blocker.innerHTML = '<span class="blocker-dot"></span>';
            container.appendChild(blocker);
        }
        
        const iframe = document.createElement('iframe');
        iframe.id = 'player-frame';
        iframe.src = url;
        
        // Tarayıcı izin politikaları ve donanım hızlandırma yetkileri
        iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture; screen-wake-lock');
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('webkitallowfullscreen', 'true');
        iframe.setAttribute('mozallowfullscreen', 'true');
        
        // Referrer politikası (VK Video gibi CDN servislerinin domain doğrulayıp tam hız vermesini sağlar)
        iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        
        // Yüksek öncelikli bant genişliği optimizasyonları (Çözünürlük düşmesini engeller)
        iframe.setAttribute('loading', 'eager');
        iframe.setAttribute('fetchpriority', 'high');
        iframe.setAttribute('importance', 'high');
        
        container.appendChild(iframe);
        
        iframe.addEventListener('load', fadeOutLoader, { once: true });
        setTimeout(fadeOutLoader, 180);
    }

    /* ─── Loader helpers ─── */
    function showLoader() {
        const l = document.getElementById('player-loader');
        l.style.opacity = '1';
        l.style.display = 'flex';
    }
    function fadeOutLoader() {
        const l = document.getElementById('player-loader');
        if (!l || l.style.display === 'none') return;
        l.style.opacity = '0';
        setTimeout(() => { l.style.display = 'none'; }, 220);
    }

    // ==========================================
    // KÜRESEL İZLENME SAYACI (GLOBAL MOVIE VIEW COUNTER - PLAYER INTEGRATION)
    // ==========================================
    const IM_APP_KEY = "0y2l63w9";
    const IM_KEY_NAME = "movie_views";

    const DEFAULTS = {
      "the-wampire-hunter-movie": 0,
      "saftirik-greg-movie": 0,
      "ancak-ruyada-olur-movie": 0,
      "the-twits-movie": 0,
      "karaya-movie": 0,
      "stitch-head-movie": 0,
      "swapped-movie": 0,
      "m1": 0,
      "m2f1-single": 0,
      "m2f2-single": 0,

      "m6f1-single": 0,
      "m6f2-single": 0,
      "m7f1-single": 0,
      "m7f2-single": 0,
      "m7f3-single": 0,
      "m7f4-single": 0,
      "avatar-ates-ve-kul": 0,

      "m8f1-single": 0,

      "raya-ve-son-ejderha-movie": 0,
      "hayalet-filmler-movie": 0,
      "kpop-iblis-avilari-movie": 0,
      "sadece-sen-movie": 0,
      "sadece-sen-single": 0,
      "dag1-single": 0,
      "dag2-single": 0,
      "s1e1": 0,
      "s1e2": 0
    };

    function getViewsId(id) {
      if (!id) return '';
      if (id.endsWith('-movie')) return id.replace('-movie', '-single');
      if (/^m\df\d$/.test(id)) return id + '-single';
      return id;
    }

    function encodeSafeBase64(obj) {
      const str = JSON.stringify(obj);
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=/g, '');
    }

    function decodeSafeBase64(safeBase64) {
      if (!safeBase64) return {};
      let base64 = safeBase64.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) {
        base64 += '=';
      }
      try {
        const decodedStr = decodeURIComponent(escape(atob(base64)));
        return JSON.parse(decodedStr);
      } catch (e) {
        console.error("decodeSafeBase64 error:", e);
        return {};
      }
    }

    function incrementMovieViews(id) {
      if (!id) return;
      const targetId = getViewsId(id);
      const localKey = `siom_views_${targetId}`;
      
      // Update local storage first
      let count = localStorage.getItem(localKey);
      let parsedLocal = count === null ? (DEFAULTS[targetId] || 0) : parseInt(count, 10);
      parsedLocal += 1;
      localStorage.setItem(localKey, parsedLocal.toString());

      // Update cloud and merge
      fetch(`https://keyvalue.immanuel.co/api/KeyVal/GetValue/${IM_APP_KEY}/${IM_KEY_NAME}`)
        .then(res => res.json())
        .then(data => {
          let dbViews = {};
          if (data && data !== '""' && data !== 'null') {
            try {
              let rawStr = data;
              if (typeof rawStr === 'string' && rawStr.startsWith('"') && rawStr.endsWith('"')) {
                rawStr = JSON.parse(rawStr);
              }
              dbViews = decodeSafeBase64(rawStr) || {};
            } catch (e) {}
          }
          
          const currentCloudVal = dbViews[targetId];
          const parsedVal = (currentCloudVal !== undefined && currentCloudVal !== null && currentCloudVal !== '') ? parseInt(currentCloudVal, 10) : (DEFAULTS[targetId] || 0);
          dbViews[targetId] = parsedVal + 1;
          
          // Re-update local storage with the cloud-merged value to be 100% accurate
          localStorage.setItem(localKey, dbViews[targetId].toString());
          
          const safePayload = encodeSafeBase64(dbViews);
          fetch(`https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/${IM_APP_KEY}/${IM_KEY_NAME}/${safePayload}`, {
            method: 'POST'
          });
        })
        .catch(err => console.error("Global increment error in player:", err));
    }

    // Trigger increment on player load
    const movieId = params.get('id') || '';
    if (movieId) {
      const sessionKey = `siom_played_${movieId}`;
      if (!sessionStorage.getItem(sessionKey)) {
        sessionStorage.setItem(sessionKey, 'true');
        incrementMovieViews(movieId);
      }
    }
