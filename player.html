<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiomJourney | Sinematik Oynatıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #050508;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        /* Immersive Spatial Ambient Glow */
        .player-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(80px) brightness(0.2) saturate(1.5);
            opacity: 0.7;
            z-index: 1;
            transition: opacity 1s ease;
        }
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(5, 5, 8, 0.98) 100%);
            z-index: 2;
        }
        /* Player Header (Auto-hide on idle) */
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(5, 5, 8, 0.95) 0%, transparent 100%);
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 1;
        }
        .player-header.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .player-title-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .player-badge {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: fit-content;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.35);
        }
        .player-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            background: linear-gradient(to right, #fff, #b3b3cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .player-close-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-close-btn:hover {
            background: rgba(255, 0, 85, 0.15);
            border-color: rgba(255, 0, 85, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        }
        /* Main Player Container */
        .player-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .player-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: #000;
            display: block;
        }
        /* Archive.org Logo Blocker Overlay */
        .player-logo-blocker {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 55px;
            height: 55px;
            background: #000000;
            z-index: 99999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.95);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .blocker-dot {
            width: 8px;
            height: 8px;
            background: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0055;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        /* Premium Loading Screen */
        .player-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 20px;
            transition: opacity 0.8s ease;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 0, 85, 0.1);
            border-top: 3px solid #ff0055;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        }
        .loader-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="player-backdrop" id="player-bg"></div>
    <div class="player-overlay"></div>

    <div class="player-loader" id="player-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Premium Sinema Yükleniyor...</div>
    </div>

    <header class="player-header" id="player-header">
        <div class="player-title-info">
            <span class="player-badge">SİNEMA MODU</span>
            <h3 id="player-title" class="player-title">Yükleniyor...</h3>
        </div>
        <button class="player-close-btn" onclick="window.close()">✕ Kapat</button>
    </header>

    <div class="player-canvas">
        <div class="player-container" id="video-container">
            <!-- Dynamic elements load here -->
        </div>
    </div>

    <script>
        // Parse params
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('file') || params.get('url');
        const movieTitle = params.get('title') || 'Sinematik Deneyim';
        const moviePoster = params.get('poster');

        document.getElementById('player-title').textContent = movieTitle;

        if (moviePoster && moviePoster !== 'null' && moviePoster !== 'undefined') {
            document.getElementById('player-bg').style.backgroundImage = `url(${moviePoster})`;
        }

        const container = document.getElementById('video-container');

        // Setup idle timer
        let idleTimeout;
        const header = document.getElementById('player-header');
        
        function resetIdleTimer() {
            header.classList.remove('hidden');
            document.body.style.cursor = 'default';
            clearTimeout(idleTimeout);
            idleTimeout = setTimeout(() => {
                header.classList.add('hidden');
                document.body.style.cursor = 'none';
            }, 3000);
        }

        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();

        if (!fileUrl) {
            container.innerHTML = '<div style="color:rgba(255,255,255,0.4); font-size:18px; font-weight:500;">Geçersiz veya eksik video adresi.</div>';
            document.getElementById('player-loader').style.display = 'none';
        } else {
            loadPlayer(fileUrl);
        }

        function loadPlayer(file) {
            // Archive.org: DOĞRUDAN embed iframe kullan (mp4 download linki güvenilmez ve 404 verir)
            if (file.includes('archive.org')) {
                loadIframePlayer(file);
                return;
            }

            // Gerçek .mp4 dosya linkleri için native video oynatıcı
            if (file.endsWith('.mp4') || file.includes('.mp4?')) {
                container.innerHTML = `
                    <video id="player-video" src="${file}" controls autoplay playsinline style="width:100%; height:100%; object-fit:contain;"></video>
                `;
                const videoEl = document.getElementById('player-video');
                videoEl.addEventListener('canplay', () => { fadeOutLoader(); });
                videoEl.addEventListener('error', () => {
                    console.warn("Native video oynatıcı hata verdi, iframe moduna geçiliyor.");
                    loadIframePlayer(file);
                });
                return;
            }

            // Diğer tüm kaynaklar (Dailymotion, YouTube, vb.) için iframe
            loadIframePlayer(file);
        }

        function loadIframePlayer(file) {
            let finalUrl = file;
            let showBlocker = false;

            if (file.includes('archive.org/embed/')) {
                showBlocker = true;
                finalUrl = file + (file.includes('?') ? '&' : '?') + 'autoplay=1';
            } else if (file.includes('pixeldrain.com/u/')) {
                finalUrl = file.replace('pixeldrain.com/u/', 'pixeldrain.com/u/') + '?embed';
            } else if (file.includes('youtube.com') || file.includes('youtu.be')) {
                let ytId = '';
                if (file.includes('embed/')) ytId = file.split('embed/')[1]?.split('?')[0];
                else ytId = file.split('v=')[1]?.split('&')[0] || file.split('youtu.be/')[1]?.split('?')[0];
                finalUrl = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&modestbranding=1&rel=0`;
            } else if (file.includes('dailymotion.com') || file.includes('dai.ly')) {
                let dmId = '';
                if (file.includes('video/')) dmId = file.split('video/')[1]?.split('?')[0]?.split('&')[0];
                else if (file.includes('dai.ly/')) dmId = file.split('dai.ly/')[1]?.split('?')[0];
                if (dmId) {
                    finalUrl = `https://www.dailymotion.com/embed/video/${dmId}?autoplay=1&queue-enable=false&queue-autoplay-next=false&ui-logo=false`;
                }
            }

            let blockerHtml = showBlocker ? `
                <div class="player-logo-blocker" id="logo-blocker">
                    <span class="blocker-dot"></span>
                </div>
            ` : '';

            container.innerHTML = `
                ${blockerHtml}
                <iframe id="player-frame" src="${finalUrl}" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            `;

            const iframe = document.getElementById('player-frame');
            iframe.addEventListener('load', () => {
                fadeOutLoader();
            });
            
            // Güvenlik amaçlı: Yüklenme gerçekleşmezse 3 saniye sonra ekranı kaldır
            setTimeout(fadeOutLoader, 3000);
        }

        function fadeOutLoader() {
            const loader = document.getElementById('player-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 800);
            }
        }
    </script>
</body>
</html>
